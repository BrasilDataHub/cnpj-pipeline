name: Flow Main

on:
  push:
    branches:
      - main
    tags:
      - v*

  # Create a button to trigger the workflow manually.
  workflow_dispatch:

env:
  IMAGE_NAME: cnpj-etl

jobs:

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      IMAGE_TAG: ${{ steps.docker_push.outputs.IMAGE_TAG }}
      VERSION: ${{ steps.version.outputs.VERSION }}
      BUILD_TIMESTAMP: ${{ steps.version.outputs.BUILD_TIMESTAMP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set version
        id: version
        run: |
          # Strip git ref prefix from version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          BUILD_TIMESTAMP=$(TZ=UTC date '+%Y-%m-%d %H:%M:%S %Z')

          # Strip "v" prefix from tag name
          [[ "${{ github.ref }}" == "refs/tags/"* ]] && VERSION=$(echo $VERSION | sed -e 's/^v//')

          # Use Version `edge` tag convention
          if [ "$VERSION" == "main" ] || [ "$VERSION" == "merge" ]; then
            VERSION=edge
          fi

          # Update version in project
          echo "{\"version\": \"$VERSION\", \"build\": \"$BUILD_TIMESTAMP\", \"dockerImage\": \"true\"}" > ./data/version.json

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          BUILD_TIMESTAMP: ${{ steps.version.outputs.BUILD_TIMESTAMP }}
        run: |
          docker build . --file docker/etl/Dockerfile --tag $IMAGE_NAME

      - name: Login into registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login docker.pkg.github.com -u ${{ github.actor }} --password-stdin

      - name: Push Docker image
        id: docker_push
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          IMAGE_ID=docker.pkg.github.com/${{ github.repository }}/$IMAGE_NAME

          # Use Docker `latest` tag convention
          if [ "$VERSION" == "main" ] || [ "$VERSION" == "merge" ] || [ "$VERSION" == "edge" ]; then
            VERSION="latest"
          fi

          # Change all uppercase to lowercase
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          docker tag $IMAGE_NAME $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION

          echo "IMAGE_TAG=$VERSION" >> $GITHUB_OUTPUT
