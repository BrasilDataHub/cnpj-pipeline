name: Publica imagem no GHCR

# Publica a imagem deste serviço no GitHub Container Registry, sob o namespace
# da organização (minúsculo, exigência de nome de imagem Docker):
#
#   ghcr.io/brasildatahub/cnpj-pipeline
#
# O repositório é privado, mas o package é público (pull anônimo) — mesmo
# padrão das imagens de infraestrutura do repositório BrasilDataHub/infra.
#
# Tags geradas:
#   push na main   -> :latest e :sha-<commit curto>
#   tag git v1.2.3 -> :1.2.3, :1.2, :1 e :sha-<commit curto>

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  NAMESPACE: brasildatahub
  IMAGE_NAME: cnpj-pipeline

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags e labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
