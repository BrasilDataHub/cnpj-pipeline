services:
  postgres:
    # Imagem da nossa infra (repositório infra/, publicada pela CI no GHCR —
    # pull anônimo): postgres:17 + postgresql.conf gerado no start a partir
    # das envs PG_* (defaults = cenário atual, host compartilhado) + initdb
    # com pg_trgm/unaccent/pg_stat_statements/btree_gin e role dados_read.
    # Cenários de tuning por máquina: infra/postgres/README.md.
    image: ghcr.io/brasildatahub/postgres:17
    container_name: rfb-cnpj-postgres
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DBNAME:-dados_cnpj}", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5
      timeout: 5s
    volumes:
      - ./docker/volumes/postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DBNAME:-dados_cnpj}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Collation C é premissa de performance da base (LIKE 'prefixo%' usa
      # btree comum) — só vale na PRIMEIRA inicialização (volume vazio).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Senha do role de leitura do website (initdb; opcional em ambiente ETL)
      DADOS_READ_PASSWORD: ${DADOS_READ_PASSWORD:-}
      # Tuning PG_* — os defaults da imagem JÁ SÃO o cenário atual
      # (compartilhado, ~4 GB p/ o Postgres). Sobrescreva via .env somente
      # em máquina diferente; a carga mensal se beneficia de mais
      # maintenance_work_mem/WAL se a máquina tiver folga:
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-2GB}
      PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      PG_WORK_MEM: ${PG_WORK_MEM:-32MB}
      PG_MAINTENANCE_WORK_MEM: ${PG_MAINTENANCE_WORK_MEM:-512MB}
      PG_MAX_WAL_SIZE: ${PG_MAX_WAL_SIZE:-4GB}
      PG_RANDOM_PAGE_COST: ${PG_RANDOM_PAGE_COST:-1.5}
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    networks:
      - rfb-cnpj-network
    shm_size: ${PG_SHM_SIZE:-1gb}
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-8G}
        reservations:
          memory: 2G

  etl:
    build:
      context: .
      dockerfile: docker/etl/Dockerfile
    container_name: cnpj-pipeline
    depends_on:
      postgres:
        condition: service_healthy
      etl-init-permissions:
        condition: service_completed_successfully
    volumes:
      # Volume para persistir arquivos baixados no host
      - ./data/downloads:/app/data/downloads
      # Volume para logs do ETL no host
      - ./data/logs:/app/data/logs
      # Volume para dados IBGE (somente leitura)
      - ./data/locations:/app/data/locations:ro
    environment:
      # Conexão com PostgreSQL (usa o nome do serviço como host)
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DBNAME: ${POSTGRES_DBNAME:-dados_cnpj}
      # Caminhos dentro do container
      DOWNLOAD_PATH: ${DOWNLOAD_PATH:-/app/data/downloads}
      IBGE_CSV_DIR: ${IBGE_CSV_DIR:-/app/data/locations}
    networks:
      - rfb-cnpj-network
    # Stdin/tty para barras de progresso interativas
    stdin_open: true
    tty: true
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  etl-init-permissions:
    image: alpine:3.19
    container_name: cnpj-pipeline-init-permissions
    user: "0:0"
    volumes:
      - ./data/downloads:/app/data/downloads
      - ./data/logs:/app/data/logs
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /app/data/downloads /app/data/logs && \
        chown -R ${ETL_UID:-1000}:${ETL_GID:-1000} /app/data/downloads /app/data/logs && \
        chmod -R 0775 /app/data/downloads /app/data/logs
    restart: "no"

networks:
  rfb-cnpj-network:
    driver: bridge
    name: rfb-cnpj-network
